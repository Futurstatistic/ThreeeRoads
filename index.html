<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Roads: one life in one minute</title>
<meta name="description" content="Spin the wheel to be born somewhere, pick a path, take three risks. A one-minute life game built on real pay data from 18 countries.">
<meta property="og:title" content="Three Roads: one life in one minute">
<meta property="og:description" content="You don’t choose where you’re born. Spin, pick a path, take your chances. Can you beat your friends?">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#eef2f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f7; --card: #ffffff; --card-2: #f3f6fa; --edge: #d3dbe7; --hair: #e4e9f1;
  --ink: #162036; --muted: #5a6679; --accent: #0b7d75; --accent-2: #0a6a63;
  --r1: #2a6fdb; --r2: #7b4fd6; --r3: #cf4129;
  --good: #17734a; --good-bg: #56c596; --bad: #b3261e; --bad-bg: #f0906a; --mid: #8fa9cf;
  --win-off: #b8c6dc; --win-on: #ffc94a;
  --w1: #2a6fdb; --w2: #7b4fd6; --w3: #cf4129; --w4: #0b7d75; --w5: #b3780a; --w6: #44597a;
  --font: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-ar: "Cairo", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-zh: "Nunito", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
.app { max-width: 520px; margin: 0 auto; padding: 14px 18px 48px; min-height: 100vh; overflow-x: clip; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar: name and a seven-stop road that fills as life goes on */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font-weight: 900; letter-spacing: 0.16em; font-size: 14px; white-space: nowrap; }
.steps { display: flex; align-items: center; gap: 0; }
.steps i { width: 9px; height: 9px; border-radius: 50%; background: var(--edge); display: block; }
.steps i + i { margin-inline-start: 11px; position: relative; }
.steps i + i::before { content: ""; position: absolute; inset-inline-end: 9px; top: 3.5px; width: 11px; height: 2px; background: var(--edge); }
.steps i.done, .steps i.done::before, .steps i.now::before { background: var(--accent); }
.steps i.now { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.srcline { display: inline-flex; align-items: center; gap: 5px; margin: 0; padding: 4px 2px; background: none; border: 0; cursor: pointer; font-weight: 800; font-size: 13px; color: var(--muted); }
.srcline .bang { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--muted); color: #fff; font-size: 12px; font-weight: 900; line-height: 1; font-family: Georgia, serif; font-style: italic; }
.srcline:hover { color: var(--ink); } .srcline:hover .bang { background: var(--ink); }
.srcline:focus-visible { outline: 3px solid var(--r1); outline-offset: 2px; }
.road { height: 6px; margin: 10px 0 18px; border-radius: 3px;
  background: repeating-linear-gradient(90deg, var(--r1) 0 34px, transparent 34px 46px, var(--r2) 46px 80px, transparent 80px 92px, var(--r3) 92px 126px, transparent 126px 138px); }

h1, h2 { margin: 0; font-weight: 900; line-height: 1.08; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: clamp(30px, 8.4vw, 42px); }
h2 { font-size: clamp(25px, 6.8vw, 32px); }
.sub { margin: 8px 0 0; color: var(--muted); font-size: 17px; }
.eyebrow { margin: 0 0 6px; font-weight: 900; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.hint { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: 14px; font-weight: 700; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; padding: 12px 18px; border-radius: 16px;
  border: 2px solid transparent; font-weight: 900; font-size: 18px; cursor: pointer; text-align: center; line-height: 1.2; }
.btn.go { background: var(--accent); color: #fff; box-shadow: 0 6px 0 var(--accent-2); }
.btn.go:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--accent-2); }
.btn.ghost { background: var(--card); border-color: var(--edge); color: var(--ink); }
.btn.ghost:active { background: var(--card-2); }
.btn:focus-visible, .path:focus-visible, .link:focus-visible { outline: 3px solid var(--r1); outline-offset: 3px; }
.actions { display: grid; gap: 12px; margin-top: 20px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair.one { grid-template-columns: 1fr; }
.btn.go.alt { background: var(--r1); box-shadow: 0 6px 0 #1f56ad; }
.link { background: none; border: 0; padding: 6px 2px; color: var(--accent); font-weight: 800; font-size: 15px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.links { text-align: center; margin: 22px 0 0; color: var(--muted); }

/* wheel */
.wheel-wrap { position: relative; width: min(290px, 74vw); aspect-ratio: 1; margin: 22px auto 0; }
.wheel-disc { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 14px 34px rgba(22, 32, 54, 0.22); will-change: transform; }
.wheel-disc svg { display: block; width: 100%; height: 100%; }
.wheel-disc text { font-family: var(--font); font-weight: 900; font-size: 13px; fill: #fff; }
.wheel-disc path { stroke: rgba(255, 255, 255, 0.55); stroke-width: 1; }
.wheel-pin { position: absolute; top: -9px; left: 50%; margin-left: -12px; border: 12px solid transparent; border-top: 24px solid var(--ink); filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
.wheel-hub { position: absolute; top: 50%; left: 50%; width: 28%; aspect-ratio: 1; transform: translate(-50%, -50%); display: grid; place-items: center; border-radius: 50%;
  background: #fff; border: 4px solid var(--ink); font-weight: 900; font-size: clamp(18px, 5vw, 24px); }
.wheel-hub.got { background: var(--accent); color: #fff; }

.born { margin-top: 18px; text-align: center; }
.born .k, .status .k, .else .k { font-weight: 800; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.country { font-weight: 900; font-size: clamp(32px, 9vw, 44px); line-height: 1.05; margin-top: 2px; }
.meter { display: inline-flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 14px; border-radius: 999px; background: var(--card); border: 2px solid var(--hair); }
.meter .k { font-size: 13px; }
.bars { display: inline-flex; align-items: flex-end; gap: 3px; }
.bars i { display: block; width: 7px; border-radius: 2px; background: var(--edge); }
.bars i:nth-child(1) { height: 8px; } .bars i:nth-child(2) { height: 11px; } .bars i:nth-child(3) { height: 14px; } .bars i:nth-child(4) { height: 17px; } .bars i:nth-child(5) { height: 20px; }
.bars i.on { background: var(--accent); }
.meter strong { font-weight: 900; }

/* paths */
.paths { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.path { display: grid; grid-template-rows: auto 1fr auto; gap: 4px; text-align: start; padding: 12px 12px 11px; border-radius: 16px; background: var(--card); border: 2px solid var(--hair);
  cursor: pointer; min-height: 112px; box-shadow: 0 2px 0 var(--hair); }
.path:hover { border-color: var(--accent); }
.path:active { transform: translateY(2px); }
.path .ic { font-size: 26px; line-height: 1; }
.path .nm { font-weight: 900; font-size: 16px; line-height: 1.15; }
.path .tg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.coins { font-weight: 900; color: var(--good); letter-spacing: 0.04em; font-size: 15px; }
.coins i { font-style: normal; color: var(--edge); }
.chip { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--card-2); color: var(--muted); white-space: nowrap; }
.chip.tough { background: #fde7df; color: #9a2c14; }
.chip.safe { background: #dcf3e8; color: var(--good); }

/* first job reel */
.pathname { display: inline-flex; gap: 8px; align-items: center; font-weight: 800; color: var(--muted); }
.reel { position: relative; height: 92px; margin-top: 14px; overflow: hidden; border-radius: 18px; background: var(--card); border: 2px solid var(--hair); }
.reel::before, .reel::after { content: ""; position: absolute; left: 0; right: 0; height: 18px; z-index: 1; pointer-events: none; }
.reel::before { top: 0; background: linear-gradient(var(--card), transparent); }
.reel::after { bottom: 0; background: linear-gradient(transparent, var(--card)); }
.strip { will-change: transform; }
.strip div { height: 92px; display: grid; place-items: center; padding: 0 16px; text-align: center; font-weight: 900; font-size: 23px; line-height: 1.12; text-wrap: balance; }
.tier { display: inline-block; margin: 14px 0 0; padding: 6px 12px; border-radius: 999px; font-weight: 900; font-size: 15px; }
.tier.t0 { background: #fde7df; color: #9a2c14; } .tier.t1 { background: #e3ebf7; color: #284f8f; } .tier.t2 { background: #dcf3e8; color: var(--good); }
.center { text-align: center; }

/* car and home */
.status { margin-top: 18px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.tile { margin: 0; padding: 10px 10px 8px; border-radius: 16px; background: var(--card); border: 2px solid var(--hair); text-align: center; position: relative; }
.tile .art { display: block; width: 100%; max-width: 128px; height: 58px; margin: 0 auto; }
.tile figcaption { font-weight: 800; font-size: 14px; line-height: 1.2; margin-top: 4px; }
.tile .chg { display: inline-block; margin-bottom: 4px; padding: 2px 9px; border-radius: 999px; font-weight: 900; font-size: 13px; letter-spacing: 0.02em; }
.tile .chg.up { background: #dcf3e8; color: var(--good); }
.tile .chg.down { background: #fde7df; color: var(--bad); }
.tile .chg.same { background: var(--card-2); color: var(--muted); }
.tile.up { border-color: var(--good-bg); }
.tile.down { border-color: var(--bad-bg); }

/* forks */
.chance { margin-top: 18px; }
.bar { position: relative; height: 26px; border-radius: 13px; background: var(--bad-bg); overflow: visible; }
.bar .g { position: absolute; inset: 0 auto 0 0; border-radius: 13px 0 0 13px; background: var(--good-bg); }
.needle { position: absolute; top: -8px; bottom: -8px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px #fff; }
.odds { margin: 10px 0 0; font-weight: 900; font-size: 20px; }
.fx { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 4px; font-size: 16px; }
.fx b { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-inline-end: 6px; border-radius: 50%; font-size: 13px; background: var(--card-2); color: var(--muted); }
.fx b.up { background: #dcf3e8; color: var(--good); } .fx b.down { background: #fde7df; color: var(--bad); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
.choices .btn { min-height: 64px; font-size: 17px; }
.verdict { margin: 18px 0 0; padding: 14px 16px; border-radius: 16px; font-weight: 900; font-size: 20px; line-height: 1.25; }
.verdict.win { background: #dcf3e8; color: var(--good); } .verdict.lose { background: #fde7df; color: var(--bad); } .verdict.safe { background: #e3ebf7; color: #284f8f; }

/* result card */
.card { position: relative; border-radius: 24px; padding: 20px 20px 18px; background: var(--ink); color: #fff; box-shadow: 0 16px 40px rgba(22, 32, 54, 0.28); overflow: hidden; }
.card-top { display: flex; justify-content: space-between; gap: 10px; font-weight: 900; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
.card-top .cc { color: #b8c6dc; letter-spacing: 0.06em; }
.card .road { margin: 10px 0 14px; }
.better { margin: 0; font-weight: 800; color: #b8c6dc; font-size: 16px; }
.pct { margin: 0; font-weight: 900; font-size: clamp(72px, 22vw, 104px); line-height: 0.95; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.of { margin: 2px 0 0; font-weight: 800; color: #b8c6dc; }
.card .title { margin-top: 16px; font-size: clamp(24px, 6.6vw, 30px); color: var(--win-on); }
.roast { margin: 6px 0 0; font-weight: 700; font-style: italic; font-size: 17px; }
.card .tiles { margin-top: 14px; }
.card .tile { border: 0; color: var(--ink); }
.lifeline { margin: 14px 0 0; font-size: 16px; }
.lifeline strong { font-weight: 900; }
.roads { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.roads li { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); }
.roads li.win { background: #1f6b4a; } .roads li.lose { background: #8a2a20; }
.mate { margin: 12px 0 0; font-size: 15px; color: #d5deea; }
.else { margin-top: 26px; text-align: center; }
.tile.solo { width: min(200px, 60%); margin: 8px auto 0; }

/* sources sheet and copy box */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(22, 32, 54, 0.55); display: grid; align-items: end; justify-items: center; }
.sheet[hidden] { display: none; }
.sheet-in:focus { outline: none; }
.sheet-in { width: min(560px, 100%); max-height: 88vh; overflow: auto; background: var(--card); border-radius: 22px 22px 0 0; padding: 22px 20px 26px; }
.sheet-in h2 { font-size: 24px; }
.sheet-in p { color: var(--muted); }
.sheet-in ul { padding-inline-start: 18px; margin: 12px 0 18px; display: grid; gap: 10px; font-size: 15px; }
.sheet-in a { color: var(--accent); }
.copybox { width: 100%; min-height: 110px; margin-top: 10px; font: inherit; font-size: 15px; padding: 10px; border-radius: 12px; border: 2px solid var(--edge); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 15px; }
.toast[hidden] { display: none; }

/* skip hint while something moves */
.skip-pill { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; padding: 8px 14px; border-radius: 999px; background: rgba(22, 32, 54, 0.82); color: #fff; font-weight: 800; font-size: 14px; display: none; }
body.show-on .skip-pill { display: block; }

/* motion */
.pop-in { animation: pop 0.42s cubic-bezier(.2, 1.4, .4, 1) both; }
.rise { animation: rise 0.45s ease-out both; }
.rise.d1 { animation-delay: 0.08s; } .rise.d2 { animation-delay: 0.16s; } .rise.d3 { animation-delay: 0.24s; } .rise.d4 { animation-delay: 0.32s; }
@keyframes pop { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.confetti { position: fixed; top: -12px; width: 9px; height: 14px; border-radius: 2px; z-index: 15; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--rot)); } }
@media (prefers-reduced-motion: reduce) {
  .pop-in, .rise { animation: none; }
  .confetti { display: none; }
}
@media (min-width: 700px) {
  .app { padding-top: 26px; }
  .paths { grid-template-columns: 1fr 1fr 1fr; }
}
.partner-k { display: flex; align-items: center; gap: 8px; margin: 18px 0 0; font-weight: 900; font-size: 18px; color: #ffffff; }
.partner-k .heart { color: #ff7a9a; font-size: 20px; line-height: 1; }
.card .partner-k + .title { margin-top: 2px; }
.shot { display: block; width: min(320px, 100%); margin: 12px auto; border-radius: 14px; box-shadow: 0 8px 24px rgba(22, 32, 54, 0.25); }
@media (max-width: 380px) {
  .brand { letter-spacing: 0.1em; font-size: 13px; }
  .top { gap: 8px; }
  .steps i { width: 8px; height: 8px; }
  .steps i + i { margin-inline-start: 8px; }
  .steps i + i::before { inset-inline-end: 8px; top: 3px; width: 8px; }
}
/* A game, not a document: long presses should not select text or open callouts on the game itself. */
.app { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.sheet-in { -webkit-user-select: text; user-select: text; }
.shot { -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }

/* languages */
.langsel { font: inherit; font-weight: 800; font-size: 14px; color: var(--ink); background: var(--card); border: 2px solid var(--hair); border-radius: 999px; padding: 5px 10px; max-width: 46%; }
:root[lang="ar"] body { font-family: var(--font-ar); line-height: 1.6; }
:root[lang="ar"] .wheel-disc text { font-family: var(--font); }
:root[lang^="zh"] body { font-family: var(--font-zh); }
:root[dir="rtl"] * { letter-spacing: 0 !important; }
:root[dir="rtl"] .brand { letter-spacing: 0.1em !important; }
:root[dir="rtl"] .bar { transform: scaleX(-1); }
.wheel-wrap { direction: ltr; }
:root[dir="rtl"] .roast, :root[lang^="zh"] .roast { font-style: normal; }
/* life events and the real-data tag */
.event { display: grid; gap: 2px; margin: 0 0 14px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--hair); background: var(--card); }
.event .ev-k { font-weight: 800; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.event .ev-t { font-weight: 800; font-size: 16px; }
.event.up { border-color: var(--good-bg); } .event.up b { color: var(--good); }
.event.down { border-color: var(--bad-bg); } .event.down b { color: var(--bad); }
.event.same b { color: var(--muted); }
.realtag { display: inline-block; margin-inline-start: 10px; padding: 3px 10px; border-radius: 999px; border: 0; background: #e3ebf7; color: #284f8f; font-weight: 800; font-size: 13px; vertical-align: middle; cursor: pointer; }
:root[dir="rtl"] .event .ev-k { letter-spacing: 0; }

</style>
</head>
<body>
<main id="app" class="app"></main>
<p id="live" class="sr" aria-live="polite"></p>
<div class="sheet" id="sheet" hidden><div class="sheet-in" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="sheetH"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="skip-pill" aria-hidden="true">Tap to skip</div>

 nazionali raccolte da [[f2m|Focus2Move]] e [[motor1|Motor1]]. Quale auto ti dà il tuo budget è solo un’approssimazione.","<strong>Inventato per il gioco:</strong> tutte le probabilità tranne quella dell’impresa, gli eventi della vita, quanto è difficile ogni settore, cosa vinci o perdi, le case e il punteggio. “Meglio del N%” ti confronta con 4.000 giocatori virtuali nati nel tuo paese che scelgono a caso.","<strong>Un gioco, non un consiglio di carriera.</strong> La vita vera dipende da molto più di una ruota e tre scelte."],"names":{"countries":{"United States":"Stati Uniti","Switzerland":"Svizzera","Germany":"Germania","United Kingdom":"Regno Unito","France":"Francia","Canada":"Canada","Australia":"Australia","Japan":"Giappone","South Korea":"Corea del Sud","Saudi Arabia":"Arabia Saudita","Türkiye":"Turchia","China":"Cina","South Africa":"Sudafrica","Mexico":"Messico","Brazil":"Brasile","India":"India","Indonesia":"Indonesia","Egypt":"Egitto"},"majors":{"Medicine & Health":"Medicina e salute","Computer Science":"Informatica","Engineering":"Ingegneria","Business & Finance":"Economia e finanza","Law & Public Policy":"Legge e politiche pubbliche","Education":"Istruzione","Architecture & Design":"Architettura e design","Natural Sciences":"Scienze naturali","Pharmacy & Allied Health":"Farmacia e professioni sanitarie","Environment & Agriculture":"Ambiente e agricoltura","Social Sciences & Humanities":"Scienze sociali e umane","Media & Communication":"Media e comunicazione"},"jobs":{"Accountant":"Contabile","Actuary":"Attuario/a","Agricultural and food scientist":"Scienziato/a agrario/a e alimentare","Agricultural engineer":"Ingegnere agrario","Agricultural technician":"Tecnico/a agrario/a","Animator or VFX artist":"Animatore/trice o artista di effetti visivi","Anthropologist":"Antropologo/a","Architect":"Architetto/a","Architecture and engineering manager":"Responsabile architettura e ingegneria","Art director":"Art director","Biochemist":"Biochimico/a","Biological t       art = shadow(k.x[0] - k.r - 6, k.x[1] + k.r + 6) +
        (k.wing ? `<path d="M5 21H19L17 27" fill="none" stroke="${line}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` : '') +
        (k.rail ? `<path d="${k.rail}" stroke="${line}" stroke-width="2" stroke-linecap="round"/>` : '') +
        `<path d="${k.b}" fill="${paint}" stroke="${line}" stroke-width="1.5" stroke-linejoin="round"/>` +
        k.w.map(d => `<path d="${d}" fill="${glass}"/>`).join('') +
        (k.bed ? `<path d="M7 22H50" stroke="${line}" stroke-width="2"/>` : '') +
        (k.door ? `<path d="${k.door}" stroke="${line}" stroke-width="1"/>` : '') +
        (k.chrome ? `<path d="M10 29.5H110" stroke="#eef2f7" stroke-width="1.4"/>` : '') +
        (k.intake ? `<path d="M58 31L72 27.5V33Z" fill="${line}"/>` : '') +
        (k.clad ? `<path d="M${k.x[0] - k.r - 2} 34H${k.x[1] + k.r + 2}" stroke="${tyre}" stroke-width="3" opacity="0.55"/>` : '') +
        `<rect x="${k.f[0]}" y="${k.f[1]}" width="4" height="3" rx="1" fill="#ffe08a"/><rect x="${k.k[0]}" y="${k.k[1]}" width="3" height="3" rx="1" fill="#e5484d"/>` +

    return `<svg class="art" viewBox="0 0 120 48" aria-hidden="true">${art}</svg>`;
  }
  // The car for a country and budget step: a local best-seller where there is one, else the world default.
  const carLabel = (c, i) => { const o = carOf(c.id, i); if (!o.name) return T.cars[i]; const n = nm('cars', o.name); return o.used ? fill(T.usedCar, { m: n }) : n; };
  const carPic = (c, i) => { const o = carOf(c.id, i); return carSVG(i, o.kind, o.used); };
  /* ---- the home ---- */
  function homeSVG(i) {
    const wall = 'fill="var(--card-2)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"';
    const win = (x, y, lit) => `<rect x="${x}" y="${y}" width="7" height="7" fill="${lit ? 'var(--win-on)' : 'var(--win-off)'}"/>`;
    const grid = (xs, ys, litX, litY) => ys.map(y => xs.map(x => win(x, y, x === litX && y === litY)).join('')).join('');
    const art = [
      `<rect x="6" y="38" width="22" height="20" ${wall}/><rect x="92" y="38" width="22" height="20" ${wall}/><rect x="26" y="28" width="68" height="30" ${wall}/><polygon points="20,28 60,8 100,28" ${wall}/>` +
        `<rect x="55" y="42" width="10" height="16" fill="var(--ink)"/>` + [34, 44, 70, 80].map(x => win(x, 35, true)).join('') + win(13, 44, true) + win(100, 44, true),
      `<rect x="74" y="12" width="6" height="12" ${wall}/><rect x="34" y="30" width="52" height="28" ${wall}/><polygon points="28,30 60,10 92,30" ${wall}/>` +
        `<rect x="56" y="42" width="9" height="16" fill="var(--ink)"/>` + win(41, 38, true) + win(72, 38, true),
      `<rect x="22" y="26" width="36" height="32" ${wall}/><rect x="62" y="26" width="36" height="32" ${wall}/><polygon points="20,26 40,12 60,26" ${wall}/><polygon points="60,26 80,12 100,26" ${wall}/>` +
        `<rect x="36" y="44" width="8" height="14" fill="var(--ink)"/><rect x="76" y="44" width="8" height="14" fill="var(--muted)"/>` + win(27, 33, true) + win(46, 33, true) + win(67, 33, false) + win(86, 33, false),
      `<rect x="36" y="14" width="48" height="44" ${wall}/>` + grid([43, 56.5, 70], [20, 32, 44], 56.5, 32),
      `<rect x="42" y="4" width="36" height="54" ${wall}/>` + grid([49, 64], [9, 19, 29, 39], 49, 29) + `<rect x="56" y="49" width="8" height="9" fill="var(--muted)"/>`,
      `<rect x="14" y="26" width="92" height="32" ${wall}/>` + grid([20, 33, 46, 59, 72, 85, 95], [31, 43], 59, 43),
    ][i];
    return `<svg class="art" viewBox="0 0 120 64" aria-hidden="true"><path d="M2 59 H118" stroke="var(--edge)" stroke-width="2"/>${art}</svg>`;
  }
  // Car and home tiles. With a "before", a better car or home gets a green arrow, a worse one a red arrow.
  function tilesHTML(st, before, cls = '') {
    const carMove = before ? Math.sign(st.car - before.car) : 0, homeMove = before ? Math.sign(before.home - st.home) : 0;
    const tag = m => (m > 0 ? 'up' : m < 0 ? 'down' : before ? 'same' : '');
    const badge = m => (!before ? '' : m > 0 ? `<span class="chg up">▲ ${esc(T.upgrade)}</span>` : m < 0 ? `<span class="chg down">▼ ${esc(T.downgrade)}</span>` : `<span class="chg same">= ${esc(T.sameAs)}</span>`);
    return `<div class="tiles ${cls}">
      <figure class="tile ${tag(carMove)}${carMove ? ' pop-in' : ''}">${badge(carMove)}${carPic(S.c, st.car)}<figcaption>${esc(carLabel(S.c, st.car))}</figcaption></figure>
      <figure class="tile ${tag(homeMove)}${homeMove ? ' pop-in' : ''}">${badge(homeMove)}${homeSVG(st.home)}<figcaption>${esc(T.homes[st.home])}</figcaption></figure>
    </div>`;
  }

  /* ---- views ---- */
  function header() {
    const at = S.stage === 'fork' ? 3 + S.k : STEP_OF[S.stage];
    const dots = Array.from({ length: 7 }, (_, i) => `<i class="${i < at ? 'done' : i === at ? 'now' : ''}"></i>`).join('');
    return `<header class="top"><div class="brand">${esc(T.brand.toUpperCase())}</div>
      <button class="srcline" data-act="sources" aria-label="${esc(T.srcH)}">${esc(T.srcLine)}<span class="bang" aria-hidden="true">i</span></button>
      ${S.stage === 'start' ? `<select class="langsel" id="langsel" aria-label="Language">${LANG_ORDER.map(c => `<option value="${c}"${c === lang ? ' selected' : ''}>${esc(LANG_NAMES[c])}</option>`).join('')}</select>` : `<div class="steps" aria-hidden="true">${dots}</div>`}</header><div class="road" aria-hidden="true"></div>`;
  }
  function wheelHTML(deg, hub) {
    const a = SLICE / 2 * Math.PI / 180, R = 100, x = (R * Math.sin(a)).toFixed(2), y = (-R * Math.cos(a)).toFixed(2);
    const slices = D.countries.map((c, i) => `<g transform="rotate(${(i * SLICE).toFixed(2)})"><path d="M0 0 L-${x} ${y} A${R} ${R} 0 0 1 ${x} ${y} Z" fill="var(--w${i % 6 + 1})"/><text x="0" y="-76" text-anchor="middle">${c.id}</text></g>`).join('');
    return `<div class="wheel-wrap" role="img" aria-label="${esc(fill(T.wheelAria, { n: D.countries.length }))}">
      <div class="wheel-disc" id="wheel" style="transform:rotate(${deg.toFixed(2)}deg)"><svg viewBox="-104 -104 208 208">${slices}<circle r="101" fill="none" stroke="var(--ink)" stroke-width="5"/></svg></div>
      <div class="wheel-pin" aria-hidden="true"></div><div class="wheel-hub${hub ? ' got' : ''}" aria-hidden="true">${hub || '?'}</div></div>`;
  }
  function startView() {
    const born = S.stage === 'born';
    const sub = challenge && !born ? fill(T.challenge, { c: cn(E.byId(D.countries, challenge)) }) : T.hookSub;
    let below;
    if (!born) below = `<div class="actions"><button class="btn go" data-act="spin">${esc(T.spin)}</button></div>`;
    else if (!S.reveal) below = ``;
    else {
      const lvl = E.payLevel(S.c);
      below = `<div class="born pop-in"><div class="k">${esc(T.bornIn)}</div><div class="country">${esc(cn(S.c))}</div>
        <div class="meter"><span class="k">${esc(T.payHere)}</span><span class="bars" aria-hidden="true">${[0, 1, 2, 3, 4].map(i => `<i class="${i <= lvl ? 'on' : ''}"></i>`).join('')}</span><strong>${esc(T.payLevels[lvl])}</strong></div></div>
        <div class="actions rise d2"><button class="btn go" data-act="to-path">${esc(T.toPath)} ${ARROW}</button></div>`;
    }
    return `<section class="screen"><h1>${esc(T.hook)}</h1>${born ? '' : `<p class="sub">${esc(sub)}</p>`}
      ${wheelHTML(S.deg, born && S.reveal ? S.c.id : '')}${below}</section>`;
  }
  function pathView() {
    const tags = E.pathTags(S.c);
    const cards = D.majors.map(m => {
      const g = tags[m.id];
      const diff = g.diff === 'a' ? `<span class="chip tough">${esc(T.tough)}</span>` : g.diff === 'c' ? `<span class="chip safe">${esc(T.safeStart)}</span>` : '';
      return `<button class="path" data-act="path" data-id="${m.id}"><span class="ic" aria-hidden="true">${T.icons[m.id]}</span><span class="nm">${esc(mn(m))}</span>
        <span class="tg"><span class="coins" role="img" aria-label="${esc(T.coinsAria[g.coins - 1])}">${'$'.repeat(g.coins)}<i>${'$'.repeat(3 - g.coins)}</i></span>${diff}</span></button>`;
    }).join('');
    return `<section class="screen"><h2>${esc(T.pathH)}</h2><p class="sub">${esc(T.pathSub)}</p><div class="paths">${cards}</div></section>`;
  }
  function jobView() {
    const spec = S.m.specs[S.si], job = jn(spec.jobs[S.tier][0]);
    const rows = S.reveal ? [job] : S.rows;
    let below = ``;
    if (S.reveal) {
      const st = E.status(S.c, S.m, S.si, S.tier, []);
      below = `<div class="center"><p class="tier t${S.tier} pop-in">${esc(T.tiers[S.tier])}</p></div>
        <div class="status rise d1"><div class="k">${esc(T.now)}</div>${tilesHTML(st)}</div>
        <div class="actions rise d2"><button class="btn go" data-act="to-fork">${esc(T.liveIt)} ${ARROW}</button></div>`;
    }
    return `<section class="screen"><p class="eyebrow">${esc(fill(T.firstJob, { a: spec.start }))}</p>
      <div class="pathname"><span aria-hidden="true">${T.icons[S.m.id]}</span>${esc(mn(S.m))}</div>
      <div class="reel" aria-live="off"><div class="strip" id="strip">${rows.map(n => `<div>${esc(n)}</div>`).join('')}</div></div>${below}</section>`;
  }
  // Text for the fork at age index k: the path's own story, or one of the general choices.
  const OWN = ['abroad', 'biz', 'top'];
  function forkText(k) {
    const f = S.forks[k];
    if (OWN.includes(f)) return { F: T.forks[S.m.id][k], eff: T.effects[k], out: T.outcomes[k], tag: k === 1 ? T.forks[S.m.id][1].tag : T.recap[k] };
    return { F: T.gforks[f], eff: T.feff[f], out: T.fout[f], tag: T.gforks[f].tag };
  }
  function eventHTML(k) {
    if (k < 1 || !S.evs) return '';
    const ev = S.evs[k - 1], mood = E.eventMood(ev);
    const sign = mood > 0 ? '▲' : mood < 0 ? '▼' : '=';
    return `<div class="event ${mood > 0 ? 'up' : mood < 0 ? 'down' : 'same'}"><span class="ev-k">${esc(fill(T.age, { a: [32, 41][k - 1] }))} · ${esc(T.lifeHappens)}</span><span class="ev-t"><b aria-hidden="true">${sign}</b> ${esc(T.events[ev])}</span></div>`;
  }
  function forkView() {
    const k = S.k, f = S.forks[k], { F, eff, out } = forkText(k), p = E.chance(f, S.c), d = S.decs[k];
    let below;
    if (!S.done) below = `<div class="choices"><button class="btn go" data-act="risk">${esc(F.r)}</button><button class="btn ghost" data-act="safe">${esc(F.s)}</button></div>`;
    else if (!S.reveal) below = '';
    else {
      const kind = d.c === 'safe' ? 'safe' : d.win ? 'win' : 'lose';
      const st = E.status(S.c, S.m, S.si, S.tier, S.decs, S.evs);
      const nextLabel = k < 2 ? fill(T.next, { a: AGES[k + 1] }) : T.retire;
      below = `<p class="verdict ${kind} pop-in">${esc(out[kind])}</p>
        <div class="status rise d1"><div class="k">${esc(T.now)}</div>${tilesHTML(st, S.before)}</div>
        <div class="actions rise d2"><button class="btn go" data-act="next">${esc(nextLabel)} ${ARROW}</button></div>`;
    }
    const left = d && d.c === 'risk' ? (S.reveal ? d.u : 0) : null;
    // The business chance is real data: say where it comes from, and let a tap open the sources.
    let tag = '';
    if (f === 'biz') {
      const src = E.bizSource(S.c);
      tag = `<button class="realtag" data-act="sources">${esc(src === 'real' ? fill(T.realTag, { c: cn(S.c) }) : src === 'eu' ? T.euTag : T.worldTag)}</button>`;
    }
    return `<section class="screen fork">${eventHTML(k)}<p class="eyebrow">${esc(fill(T.age, { a: AGES[k] }))}</p><h2>${esc(F.q)}</h2><p class="sub">${esc(F.x)}</p>
      <div class="chance"><div class="bar"><span class="g" style="width:${p}%"></span>${left == null ? '' : `<span class="needle" id="needle" style="left:${left}%"></span>`}</div>
      <p class="odds">${esc(fill(T.odds, { p }))}${tag}</p></div>
      <ul class="fx"><li><b class="up" aria-hidden="true">✓</b><span class="sr">${esc(T.ifWorks)}: </span>${esc(eff.win)}</li><li><b class="down" aria-hidden="true">✗</b><span class="sr">${esc(T.ifFails)}: </span>${esc(eff.lose)}</li><li><b aria-hidden="true">=</b>${esc(T.ifSafe)}${lang === 'fr' ? ' : ' : lang === 'zh' ? '：' : ': '}${esc(lowSafe(eff.safe))}</li></ul>
      ${below}</section>`;
  }
  const lowSafe = t => (lang === 'zh' || lang === 'ar' ? t : t.charAt(0).toLowerCase() + t.slice(1));
  function roadChips() {
    return S.decs.map((d, k) => {
      const name = d.c === 'safe' ? T.played : forkText(k).tag;
      const mark = d.c === 'safe' ? '' : d.win ? ' ✓' : ' ✗';
      return `<li class="${d.c === 'safe' ? '' : d.win ? 'win' : 'lose'}">${AGES[k]} · ${esc(name)}${mark}</li>`;
    }).join('');
  }
  function endView() {
    const R = S.R, c = S.c;
    const [rk, rv] = S.roastPick;
    const roast = fill(T.roasts[rk], { a: rv.a, car: rv.car != null ? T.roastCar[rv.car] : '' });
    S.roast = roast;
    const other = E.elsewhere(c, S.m, S.si, S.tier, S.decs, S.rank, S.evs);
    return `<section class="screen end">
      <article class="card" id="card">
        <div class="card-top"><span>${esc(T.brand)}</span><span class="cc">${esc(cn(c))}</span></div><div class="road" aria-hidden="true"></div>
        <p class="better">${esc(T.better)}</p><p class="pct" dir="ltr"><span id="pct">${S.reveal ? S.pct : 0}</span>%</p><p class="of">${esc(fill(T.ofPeople, { c: cn(c) }))}</p>
        <p class="partner-k"><span class="heart" aria-hidden="true">♥</span>${esc(T.partnerK)}</p><h2 class="title">${esc(mt(R.mate))}</h2><p class="roast">${esc(quote(roast))}</p>
        ${tilesHTML({ car: R.car, home: R.home })}
        <p class="lifeline"><strong>${esc(jn(R.job))}</strong> ${ARROW} ${esc(fill(T.retiredAs, { r: low(rn(R.rankName)) }))}</p>
        <ul class="roads" aria-label="${esc(T.yourRoads)}">${roadChips()}</ul>
      </article>
      <div class="actions"><div class="pair${canShareFiles ? '' : ' one'}"><button class="btn go" data-act="save">⬇ ${esc(T.savePic)}</button>${canShareFiles ? `<button class="btn go alt" data-act="share">↗ ${esc(T.share)}</button>` : ''}</div>
        <button class="btn ghost" data-act="again">${esc(T.again)}</button></div>
      <div class="else"><div class="k">${esc(fill(T.elsewhere, { c: cn(other.country) }))}</div>
        <figure class="tile solo">${carPic(other.country, other.life.car)}<figcaption>${esc(carLabel(other.country, other.life.car))}</figcaption></figure></div>
      <p class="links"><button class="link" data-act="same">${esc(T.same)}</button><br><button class="link" data-act="sources">${esc(T.srcH)}</button></p>
    </section>`;
  }
  function render() {
    const view = S.stage === 'start' || S.stage === 'born' ? startView() : S.stage === 'path' ? pathView() : S.stage === 'job' ? jobView() : S.stage === 'fork' ? forkView() : endView();
    app.innerHTML = header() + view;
  }
  // On a short screen, bring the next button into view once it appears.
  function reach() {
    const btn = app.querySelector('.actions .btn');
    if (btn && btn.getBoundingClientRect().bottom > window.innerHeight) btn.scrollIntoView({ block: 'end', behavior: reduce() ? 'auto' : 'smooth' });
  }
  function go(stage) { S.stage = stage; render(); window.scrollTo(0, 0); }
  const say = text => { live.textContent = ''; setTimeout(() => { live.textContent = text; }, 30); };

  /* ---- what happens on each tap ---- */
  async function spin() {
    const c = challenge ? E.byId(D.countries, challenge) : D.countries[Math.floor(Math.random() * D.countries.length)];
    challenge = null;
    const idx = D.countries.indexOf(c);
    const rest = (360 - idx * SLICE + (Math.random() - 0.5) * SLICE * 0.6 + 360) % 360;
    const from = S.deg % 360;
    S.c = c; S.reveal = false; S.deg = from;
    go('born');
    E.crowd(c);                       // build the comparison crowd while the wheel turns
    const target = from + 360 * 5 + ((rest - from + 360) % 360);
    await show(async () => { await glide(document.getElementById('wheel'), 'transform', `rotate(${target}deg)`, 3400, 'cubic-bezier(.12,.7,.14,1)'); await wait(250); });
    S.deg = target; S.reveal = true; render();
    say(T.bornIn + ' ' + cn(c));
  }
  async function pickPath(id) {
    S.m = E.byId(D.majors, id);
    const j = E.firstJob(S.m, Math.random);
    S.si = j.si; S.tier = j.tier; S.decs = []; S.k = 0; S.done = false;
    S.forks = E.pickForks(Math.random); S.evs = E.pickEvents(Math.random);
    const names = S.m.specs.flatMap(s => s.jobs.map(x => jn(x[0])));
    const rows = [];
    for (let r = 0; r < 3; r++) [...names].sort(() => Math.random() - 0.5).forEach(n => rows.push(n));
    rows.push(jn(S.m.specs[S.si].jobs[S.tier][0]));
    S.rows = rows; S.reveal = false;
    go('job');
    await show(async () => {
      const strip = document.getElementById('strip'), h = strip.firstElementChild.getBoundingClientRect().height;
      await glide(strip, 'transform', `translateY(${-(rows.length - 1) * h}px)`, 2300, 'cubic-bezier(.16,.8,.2,1)');
      await wait(200);
    });
    S.reveal = true; render();
    reach();
    say(jn(S.m.specs[S.si].jobs[S.tier][0]) + '. ' + T.tiers[S.tier]);
  }
  async function choose(risky) {
    const k = S.k;
    S.before = E.status(S.c, S.m, S.si, S.tier, S.decs, S.evs, true);
    const u = Math.random() * 100, f = S.forks[k];
    const d = risky ? { f, c: 'risk', win: u < E.chance(f, S.c), u: Math.max(1, Math.min(99, u)) } : { f, c: 'safe' };
    S.decs[k] = d; S.done = true;
    if (k === 2) S.rank = E.rankFor(S.tier, d, Math.random());
    S.reveal = false; render();
    if (risky) {
      await show(async () => {
        const n = document.getElementById('needle');
        await glide(n, 'left', '100%', 700, 'ease-in-out');
        await glide(n, 'left', d.u + '%', 1100, 'cubic-bezier(.2,.8,.25,1)');
        await wait(300);
      });
    }
    S.reveal = true; render();
    reach();
    say(forkText(k).out[d.c === 'safe' ? 'safe' : d.win ? 'win' : 'lose']);
  }
  async function next() {
    if (S.k < 2) { S.k++; S.done = false; S.reveal = true; go('fork'); return; }
    const job = S.m.specs[S.si].jobs[S.tier][0];
    S.mate = E.pickMate(job, Math.random);
    S.R = E.finish(S.c, S.m, S.si, S.tier, S.decs, S.rank, S.evs, S.mate);
    S.pct = E.percentile(S.c, S.R.score);
    S.roastPick = E.roast(S.c, S.R, S.tier, S.decs, S.evs, S.pct, Math.random);
    cardPromise = null;
    S.reveal = false; go('end');
    await show(async () => {
      const el = document.getElementById('pct'), t0 = performance.now(), dur = 1200;
      await new Promise(res => {
        if (reduce()) return res();
        let stop = false; skipFns.push(() => { stop = true; res(); });
        const step = now => {
          if (stop) return;
          const x = Math.min(1, (now - t0) / dur);
          el.textContent = Math.round(S.pct * (1 - Math.pow(1 - x, 3)));
          if (x < 1) requestAnimationFrame(step); else res();
        };
        requestAnimationFrame(step);
      });
    });
    S.reveal = true;
    document.getElementById('pct').textContent = S.pct;
    cardPromise = makeCard(); cardPromise.catch(() => { cardPromise = null; });
    if (S.pct >= 80 && !reduce()) confetti();
    say(T.better + ' ' + S.pct + '% ' + fill(T.ofPeople, { c: cn(S.c) }));
  }
  function confetti() {
    const colors = ['#2a6fdb', '#7b4fd6', '#cf4129', '#0b7d75', '#ffc94a'];
    for (let i = 0; i < 46; i++) {
      const p = document.createElement('i');
      p.className = 'confetti';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      p.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      p.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3600);
    }
  }
  function toast(text) {
    const el = document.getElementById('toast');
    el.textContent = text; el.hidden = false;
    clearTimeout(toast.id); toast.id = setTimeout(() => { el.hidden = true; }, 2400);
  }
  /* ---- the share picture: the result card drawn at 1080 x 1350, the size X and Instagram show best ---- */
  const HEX = { '--muted': '#5a6679', '--ink': '#162036', '--mid': '#8fa9cf', '--accent': '#0b7d75', '--bg': '#eef2f7', '--card-2': '#f3f6fa', '--edge': '#d3dbe7', '--win-off': '#b8c6dc', '--win-on': '#ffc94a' };
  function svgImage(svg, w, h) {
    const src = svg.replace(/var\((--[\w-]+)\)/g, (_, v) => HEX[v] || '#000')
      .replace('<svg class="art"', `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"`);
    return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src); });
  }
  function wrapLines(x, text, maxW) {
    const lines = []; let line = '';
    const cjk = lang === 'zh', join = cjk ? '' : ' ';
    for (const w of cjk ? Array.from(String(text)) : String(text).split(' ')) {
      const t = line ? line + join + w : w;
      if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    }
    if (line) lines.push(line);
    return lines;
  }
  async function makeCard() {
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { /* draw with what we have */ }
    const R = S.R, W = 1080, H = 1350, P = 84, cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const x = cv.getContext('2d');
    const font = (wgt, size, italic) => `${italic && !RTL && lang !== 'zh' ? 'italic ' : ''}${wgt} ${size}px Nunito, Cairo, "Noto Sans Arabic", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Zen Hei", "Trebuchet MS", sans-serif`;
    // Right-to-left languages: mirror every position and alignment.
    x.direction = RTL ? 'rtl' : 'ltr';
    const text = (t, px, py, f, color, align = 'left') => {
      if (RTL) { px = W - px; align = align === 'left' ? 'right' : align === 'right' ? 'left' : align; }
      x.font = f; x.fillStyle = color; x.textAlign = align; x.fillText(t, px, py);
    };
    const round = (rx, ry, rw, rh, r, color) => { x.fillStyle = color; x.beginPath(); x.moveTo(rx + r, ry); x.arcTo(rx + rw, ry, rx + rw, ry + rh, r); x.arcTo(rx + rw, ry + rh, rx, ry + rh, r); x.arcTo(rx, ry + rh, rx, ry, r); x.arcTo(rx, ry, rx + rw, ry, r); x.closePath(); x.fill(); };
    // Largest size (down to min) at which the text fits the width.
    const fit = (t, wgt, size, min, maxW, italic) => { let z = size; x.font = font(wgt, z, italic); while (z > min && x.measureText(t).width > maxW) { z -= 2; x.font = font(wgt, z, italic); } return z; };
    x.fillStyle = '#162036'; x.fillRect(0, 0, W, H);
    const latin = !RTL && lang !== 'zh';      // letter spacing breaks Arabic letters and looks odd in Chinese
    if ('letterSpacing' in x) x.letterSpacing = '6px';
    x.direction = 'ltr'; text('THREE ROADS', P, 118, font(900, 34), '#ffffff'); x.direction = RTL ? 'rtl' : 'ltr';
    if ('letterSpacing' in x) x.letterSpacing = latin ? '6px' : '0px';
    { const t = cn(S.c).toUpperCase(); text(t, W - P, 118, font(900, fit(t, 900, 34, 22, 520)), '#b8c6dc', 'right'); }
    if ('letterSpacing' in x) x.letterSpacing = '0px';
    const roadC = ['#2a6fdb', '#7b4fd6', '#cf4129'];
    for (let i = 0, rx = P; rx < W - P; i++, rx += 92) round(rx, 150, Math.min(70, W - P - rx), 12, 6, roadC[i % 3]);
    text(T.better, P, 250, font(800, 44), '#b8c6dc');
    x.direction = 'ltr'; text(S.pct + '%', RTL ? P + 8 : P - 8, 462, font(900, 220), '#ffffff'); x.direction = RTL ? 'rtl' : 'ltr';
    { const t = fill(T.ofPeople, { c: cn(S.c) }); text(t, P, 534, font(800, fit(t, 800, 44, 28, W - 2 * P)), '#b8c6dc'); }
    // Likely partner: a pink heart, then the label in white, big enough to read in a feed.
    x.font = font(900, 40);
    const hw = x.measureText('♥').width + 14;
    text('♥', P, 628, font(900, 40), '#ff7a9a');
    text(T.partnerK, P + hw, 628, font(900, 40), '#ffffff');
    let y = 704;
    { // the partner on one line if it fits at a readable size, else two lines
      const name = mt(R.mate), z = fit(name, 900, 64, 46, W - 2 * P);
      x.font = font(900, z);
      for (const ln of wrapLines(x, name, W - 2 * P).slice(0, 2)) { text(ln, P, y, font(900, z), '#ffc94a'); y += z + 8; }
    }
    x.font = font(700, 42, true);
    y += 6;
    for (const ln of wrapLines(x, quote(S.roast), W - 2 * P).slice(0, 2)) { text(ln, P, y, font(700, 42, true), '#ffffff'); y += 54; }
    const ty = Math.max(y + 8, 860), tw = (W - 2 * P - 28) / 2, th = 228;
    const [car, home] = await Promise.all([svgImage(carPic(S.c, R.car), 300, 120), svgImage(homeSVG(R.home), 300, 160)]);
    [[car, carLabel(S.c, R.car), 120], [home, T.homes[R.home], 160]].forEach(([img, label, ih], i) => {
      const tx = RTL ? W - P - tw - i * (tw + 28) : P + i * (tw + 28);
      round(tx, ty, tw, th, 30, '#ffffff');
      const iw = ih === 120 ? 300 : 240, ihh = ih === 120 ? 120 : 128;
      x.drawImage(img, tx + (tw - iw) / 2, ty + 26 + (128 - ihh) / 2, iw, ihh);
      const cx = RTL ? W - (tx + tw / 2) : tx + tw / 2;
      const z = fit(label, 800, 34, 26, tw - 30);
      x.font = font(800, z);
      const lines = x.measureText(label).width > tw - 30 ? wrapLines(x, label, tw - 30).slice(0, 2) : [label];
      lines.forEach((ln, j) => text(ln, cx, ty + th - 30 - (lines.length - 1 - j) * (z + 4), font(800, z), '#162036', 'center'));
    });
    let ly = ty + th + 60;
    const life = jn(R.job) + ' ' + ARROW + ' ' + fill(T.retiredAs, { r: low(rn(R.rankName)) });
    // Shrink the last line until it clears the footer band.
    let lz = 36, lines;
    for (;;) { x.font = font(700, lz); lines = wrapLines(x, life, W - 2 * P).slice(0, 2); if (lz <= 24 || ly + (lines.length - 1) * (lz + 10) <= H - 128) break; lz -= 2; }
    if (ly > H - 128) ly = H - 128;
    for (const ln of lines) { text(ln, P, ly, font(700, lz), '#d5deea'); ly += lz + 10; }
    const url = shareLink();
    x.fillStyle = 'rgba(255,255,255,0.08)'; x.fillRect(0, H - 104, W, 104);
    text(url ? url.replace(/^https?:\/\//, '').replace(/\?.*$/, '').replace(/\/$/, '') : T.beatMe, W / 2, H - 40, font(800, 34), '#d5deea', 'center');
    return await new Promise((res, rej) => cv.toBlob(b => (b ? res(b) : rej(new Error('no picture'))), 'image/png'));
  }
  let cardPromise = null;
  function shareLink() {
    try {
      if (/^https?:$/.test(location.protocol) && !/claude/i.test(location.hostname)) return location.origin + location.pathname + '?born=' + S.c.id;
    } catch (e) { /* no address */ }
    return '';
  }
  const fileName = () => 'three-roads-' + S.c.id.toLowerCase() + '-' + S.pct + '.png';
  async function picture() {
    try { return await (cardPromise || (cardPromise = makeCard())); } catch (e) { cardPromise = null; toast(T.imgFail); return null; }
  }
  // Save picture: one tap. Inside Claude, Claude's own save prompt (phone: the share sheet, computer: a download).
  // On the open web, a straight download.
  async function savePicture() {
    const blob = await picture(); if (!blob) return;
    const sv = await getSaver();
    if (sv) {
      try { const r = await sv.save({ filename: fileName(), data: blob }); if (r && r.status === 'saved') toast(T.saved); return; }
      catch (e) { if (e && (e.code === 'declined' || e.code === 'rate_limited')) return; }
    }
    if (!framed) {
      const a = document.createElement('a'), src = URL.createObjectURL(blob);
      a.href = src; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(src), 60000);
      toast(T.saved); return;
    }
    // Last resort, only where this view allows no saving at all.
    const src = await new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = () => res(''); f.readAsDataURL(blob); });
    openSheet(`<h2 id="sheetH">${esc(T.savePic)}</h2><p>${esc(T.noSaveHere)}</p><img class="shot" src="${src}" alt="${esc(T.imgAlt)}">
      <div class="actions"><button class="btn ghost" data-act="close">${esc(T.srcClose)}</button></div>`);
  }
  // Share: the phone's share sheet with the picture file only (X, WhatsApp, Instagram, Save Image...).
  async function share() {
    const blob = await picture(); if (!blob) return;
    try { await navigator.share({ files: [new File([blob], fileName(), { type: 'image/png' })] }); }
    catch (e) { if (!(e && e.name === 'AbortError')) savePicture(); }
  }
  function openSheet(html) {
    const sh = document.getElementById('sheet');
    const box = sh.querySelector('.sheet-in');
    box.innerHTML = html; sh.hidden = false; box.scrollTop = 0;
    if (!sh.querySelector('.copybox')) box.focus({ preventScroll: true });
  }
  function sources() {
    openSheet(`<h2 id="sheetH">${esc(T.srcH)}</h2><p>${esc(T.srcLead)}</p><ul>${T.src.map(s => `<li>${linkify(s)}</li>`).join('')}</ul>
      <button class="btn ghost" data-act="close">${esc(T.srcClose)}</button>`);
  }
  function closeSheet() { document.getElementById('sheet').hidden = true; }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) { if (e.target.id === 'sheet') closeSheet(); return; }
    if (busy || performance.now() - lastSkip < 350) return;
    const act = el.dataset.act;
    if (act === 'spin') spin();
    else if (act === 'to-path') go('path');
    else if (act === 'path') pickPath(el.dataset.id);
    else if (act === 'to-fork') { S.k = 0; S.done = false; S.reveal = true; go('fork'); }
    else if (act === 'risk') choose(true);
    else if (act === 'safe') choose(false);
    else if (act === 'next') next();
    else if (act === 'share') share();
    else if (act === 'save') savePicture();
    else if (act === 'again') { fresh(); go('start'); }
    else if (act === 'same') { fresh(S.c); go('path'); }
    else if (act === 'sources') sources();
    else if (act === 'close') closeSheet();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet(); });
  document.addEventListener('change', e => { if (e.target.id === 'langsel') { setLang(e.target.value); render(); } });

  fresh();
  render();
  window.__threeRoads = { state: () => S, card: async () => { const b = await (cardPromise || makeCard()); return await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); } };   // for the automatic tests
})();

</script>
